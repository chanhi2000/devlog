packages:
  # all packages in subdirs of packages/
  - "devo-api/"
  - "scripts/*"
  # if you have other directories, you can add them too
  # - 'components/*'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sqlite3: false
catalog:
  axios: 1.7.7
  concurrently: 9.2.1
  cpx2: 8.0.0
  tsx: 4.21.0
  typescript: 5.9.3
  vite: 7.1.12
  vitest: 4.0.16
  vue: 3.5.25
  vue-tsc: 3.2.8
  dotenv: 16.3.1
  express: 4.18.2

catalogs:
  devlog: 
    devo-api: 0.15.16
    
  range:
    baseline-status: ^1.1.1
    chart.js: ^4.4.3
    cross-env: ^7.0.3
    dashjs: ^4.7.4
    echarts: ^6.0.0
    flowchart.ts: ^3.0.0
    fs-extra: ^11.2.0
    hls.js: ^1.4.12
    kotlin-playground: ^1.30.0
    mermaid: ^11.12.0
    sass: ^1.93.3
    sass-embedded: ^1.93.3
    sass-loader: ^16.0.6
    vidstack: ^1.11.29

  vuepress:
    "@vuepress/bundler-vite": 2.0.0-rc.26
    "@vuepress/helper": 2.0.0-rc.120
    "@vuepress/plugin-photo-swipe": 2.0.0-rc.120
    "@vuepress/plugin-prismjs": 2.0.0-rc.120
    "@vuepress/plugin-register-components": 2.0.0-rc.118
    vuepress: 2.0.0-rc.26
    vuepress-plugin-markdown-define2: ^1.0.0
    vuepress-theme-hope: 2.0.0-rc.99
overrides:
  '@bookshelf/shared-vuepress': link:shared-vuepress
  esbuild: ^0.27.1
  react: ^19.2.3

peerDependencyRules:
  allowedVersions:
    echarts-wordcloud@2>echarts: ^6.0.0
